<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📸 时光照相馆 · 自由比例 · 完整显示</title>
    <style>
        /* 基础重置 + 温和背景 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f4f7fb;
            background-image: radial-gradient(circle at 30% 40%, rgba(230, 240, 255, 0.4) 0%, transparent 30%),
                              radial-gradient(circle at 80% 70%, rgba(255, 225, 240, 0.3) 0%, transparent 40%);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 主容器 — 更像一个温暖的展厅 */
        .gallery-container {
            max-width: 1400px;
            width: 100%;
        }

        /* 标题区 · 温柔手写感 */
        .gallery-header {
            text-align: center;
            margin-bottom: 3.5rem;
        }

        .gallery-header h1 {
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 6px;
            color: #3e4b5e;
            text-shadow: 3px 3px 6px rgba(170, 190, 210, 0.3), 0 1px 0 #ffffff;
            word-break: keep-all;
        }

        .gallery-header p {
            font-size: 1.3rem;
            color: #607586;
            font-style: italic;
            border-bottom: 2px dotted #b3c9d6;
            display: inline-block;
            padding-bottom: 0.5rem;
            margin-top: 0.5rem;
        }

        /* 瀑布流网格 —— 不限制比例，完全由图片撑开 */
        .photo-wall {
            column-count: 4;           /* 四列，适合多种比例 */
            column-gap: 1.8rem;
            width: 100%;
        }

        /* 每个照片卡片 —— 完全自适应，不断开 */
        .photo-card {
            break-inside: avoid;       /* 避免卡片被截断到两列 */
            margin-bottom: 1.8rem;
            background: #ffffffdd;
            backdrop-filter: blur(4px);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 15px 30px -12px rgba(30, 50, 70, 0.25);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.7);
            display: inline-block;      /* 配合 break-inside */
            width: 100%;                /* 占满列宽 */
        }

        .photo-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 40px -12px rgba(0, 40, 70, 0.35);
            border-color: #ffcfdf;
        }

        /* 图片区域 —— 完全尊重原始比例，不加任何裁剪 */
        .photo-img {
            line-height: 0;            /* 去除图片下方间隙 */
            background: #e6eef5;       /* 软背景，仅当透明或加载时可见 */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .photo-img img {
            width: 100%;                /* 宽度撑满卡片，高度自动，完全显示 */
            height: auto;               /* 关键！高度自动，让图片自己决定比例 */
            display: block;
            transition: opacity 0.4s ease;
            object-fit: fill;           /* 不裁剪，不压缩，但一般width/auto已足够 */
            background: #f1f7fc;        /* 留白区域背景（极少出现，除非透明png） */
        }

        /* 信息层 —— 轻盈漂浮 */
        .photo-info {
            padding: 1.2rem 1.4rem 1.5rem;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255,240,245,0.9);
        }

        .photo-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #1f2c38;
            margin-bottom: 0.4rem;
            letter-spacing: 0.3px;
        }

        .photo-desc {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #4a6072;
        }

        .date {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .date::before {
            content: "📅";
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .tag {
            background: #d9e7f2;
            padding: 0.25rem 1rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2f4a62;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* 装饰悬停 —— 一枚小星星 */
        .photo-card::after {
            content: "✨";
            position: absolute;
            top: 12px;
            right: 15px;
            font-size: 1.8rem;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            filter: drop-shadow(0 2px 4px rgba(255,215,0,0.4));
        }

        .photo-card:hover::after {
            opacity: 0.9;
        }

        /* 为了让星星绝对定位，父容器需要相对定位 */
        .photo-card {
            position: relative;
        }

        /* 响应式：根据屏幕宽度改变列数，始终尊重图片原始比例 */
        @media (max-width: 1000px) {
            .photo-wall {
                column-count: 3;
                column-gap: 1.5rem;
            }
        }

        @media (max-width: 700px) {
            .photo-wall {
                column-count: 2;
                column-gap: 1.2rem;
            }
            .gallery-header h1 {
                font-size: 2.6rem;
            }
        }

        @media (max-width: 450px) {
            .photo-wall {
                column-count: 1;
            }
        }

        /* 底部小彩蛋 —— 温柔加载 */
        .memory-footer {
            margin-top: 4rem;
            font-size: 1rem;
            color: #6a7f93;
            background: rgba(255,255,240,0.5);
            backdrop-filter: blur(5px);
            padding: 1rem 2.5rem;
            border-radius: 60px;
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 0 5px 12px rgba(140,160,180,0.15);
            transition: 0.2s;
        }
        .memory-footer:hover {
            background: rgba(255,255,255,0.7);
            color: #3a4b5a;
        }
    </style>
</head>
